apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: demo-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: web-app

  template:
    metadata:
      labels:
        app: web-app

    spec:
      containers:

        - name: nginx

          image: nginx:alpine

          ports:

            - containerPort: 80

          resources:

            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 200m
              memory: 128Mi